name: Compile using AlmaLinux

on: push

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: almalinux:8.9

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up dependencies
      run: dnf install -y gcc make glibc-devel.i686 openssh-clients

    - name: Compile code
      run: make
